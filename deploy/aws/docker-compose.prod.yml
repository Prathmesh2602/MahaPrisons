# Runs on the EC2 server (see provision.sh). Only Caddy (80/443) is reachable from outside;
# the API and website stay on the private Docker network. The database is Supabase Postgres (DATABASE_URL in .env).
services:
  backend:
    build: ./backend
    image: mahaprisons-backend:latest
    restart: always
    env_file: /opt/mahaprisons/.env
    volumes:
      - /opt/mahaprisons/uploads:/app/uploads

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_URL: https://${SITE_ADDRESS}
    image: mahaprisons-web:latest
    restart: always
    depends_on:
      - backend

  # HTTPS for all three sites, and serves the admin panel (built into this image from ./admin).
  caddy:
    build:
      context: ./admin
      args:
        VITE_API_URL: https://${SITE_ADDRESS}
        VITE_FRONTEND_URL: https://${WEB_ADDRESS}
    image: mahaprisons-caddy:latest
    restart: always
    depends_on:
      - backend
      - web
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
      WEB_ADDRESS: ${WEB_ADDRESS}
      ADMIN_ADDRESS: ${ADMIN_ADDRESS}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - /opt/mahaprisons/Caddyfile:/etc/caddy/Caddyfile:ro
      - /opt/mahaprisons/caddy:/data
